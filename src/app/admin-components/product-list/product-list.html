<h3>{{title}}</h3>


<h1>Ürünler</h1>

<table>
<tr>
  <th>#</th>
  <th>Görsel</th>
  <th>Ürün Adı</th>
  <th>Ürün Fiyatı</th>
</tr>

@for (item of products; track $index) {

<tr>
  <td>{{item.id}}</td>
  <td><img src="{{item.imageUrl}}" style="height: 75px;width: 75px;" > </td>
  <td>{{item.name}}</td>
  <td>{{item.price}} TL</td>
</tr>



}




</table>
